name: Music recommendation checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "docs/**"
    paths:
      - "music-recommendation/**"
      - ".github/workflows/music-recommendation.yml"
  pull_request:
    paths:
      - "music-recommendation/**"
      - ".github/workflows/music-recommendation.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-recommendation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: music-recommendation/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check frontend JavaScript syntax
        run: node --check static/app.js

      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v

      - name: Run offline model comparison
        run: python scripts/evaluate.py --k 10 > /tmp/music-recommender-evaluation.json

      - name: Validate evaluation output
        run: python -c "import json; p=json.load(open('/tmp/music-recommender-evaluation.json')); assert len(p['results']) == 5; assert p['tracks'] > 0"
